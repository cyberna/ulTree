<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
  <title>myex1</title>
</head>
<body>
  
  <p>Проверка связи</p>

<script>
  let books = {
    Genre: {
      Adventures: {
        Author: "Жуль верн",
        Name: "20 тысяч лье под водой"
      },
      Fantazy: {
        Author: "Стивен Кинг",
        Name: "Лангоньеры"
      }
    }
  };

  function createUl(obj) {
    if (typeof obj !== 'object' || obj === null || !Object.keys(obj).length) return;
    
    let ul = document.createElement('ul');
    for (let key in obj) {
      let li = document.createElement('li');
      
      // Проверяем, является ли значение примитивом
      if (typeof obj[key] !== 'object' || obj[key] === null) {
        li.textContent = `${key}: ${obj[key]}`;
      } else {
        li.textContent = key;
        let childrenUl = createUl(obj[key]);
        if (childrenUl) li.append(childrenUl);
      }
      
      ul.append(li);
    }
    return ul;
  }

  function createTree(container, obj) {
    document.querySelector(container).append(createUl(obj));
  }

  createTree('body', books); // Исправлено data → books
</script>

</body>
</html>
